name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install and test Windows package
        shell: cmd
        run: setup_windows.bat --no-pause
      - name: Run demo CLI on Windows
        shell: cmd
        run: .venv\Scripts\python.exe -X utf8 run_local.py --demo --out results\ci_demo
